<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Website -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>HandiHub - Handmade Products</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="wish.css">
    <link rel="stylesheet" href="style.css">

    <!--icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <!-- Logo -->

        <div class="logo">

            <img src="images/logo.png" alt="HandiHub Logo">

            <h2>HandiHub</h2>

        </div>

        <!-- Search Bar -->

        <div class="search-box">

            <input type="text" placeholder="Search handmade products...">

        </div>

        <!-- Navigation Menu -->

        <nav>

            <ul>

                <ul>

    <li><a href="index.html" class="active">Home</a></li>

    <li><a href="collections.html">Collections</a></li>

    <li><a href="new-arrival.html">New Arrivals</a></li>

    <li><a href="contact.html">Contact</a></li>

</ul>

            </ul>

        </nav>

        <!-- Right Side Icons -->

        <div class="header-icons">

            <button class="seller-btn"
onclick="window.location.href='seller.html'">
    Become a Seller
</button>
<!-- Wishlist -->
<a href="wish.html" class="wishlist-nav">
    <i class="bi bi-heart"></i>
    <span id="wishlistCount">0</span>
</a>

<!-- Notifications -->
<a href="not.html"><i class="bi bi-bell"></i></a>

<!-- Cart -->
<a href="cart.html" class="cart-nav">
    <i class="bi bi-cart3"></i>
    <span id="cartCount">0</span>
</a>

<!-- Profile -->
<a href="man.html"><i class="bi bi-person"></i></a>

        </div>

    </header>
<!-- ===========================
        WISHLIST SECTION
=========================== -->

<section class="wishlist-section">

    <div class="wishlist-header">

        <h1>Your Wishlist</h1>
        <p>
            Save your favorite handmade products and purchase them later.
        </p>

    </div>

    <!-- EMPTY STATE -->

    <div class="empty-wishlist" id="emptyWishlist">

        <div class="empty-icon">
    <i class="bi bi-heart"></i>
</div>
        <h2>No favorites yet</h2>

        <p>
            Tap the heart on any product to save it here.
        </p>

        <a href="collections.html" class="discover-btn">

            Discover Products

        </a>

    </div>

    <!-- PRODUCTS -->
<div id="wishlistContainer" class="wishlist-grid"></div>

</section>

<!-- ===========================
        PRODUCT CARD TEMPLATE
        (Generated by JS)
=========================== -->

<template id="wishlistCardTemplate">

    <div class="wishlist-card">

        <div class="wishlist-image">

            <img src="" class="product-image" alt="">

            <button class="remove-btn">

                <i class="ri-heart-fill"></i>

            </button>

        </div>

        <div class="wishlist-content">

            <span class="category"></span>

            <h3 class="title"></h3>

            <div class="rating">

                <i class="ri-star-fill"></i>

                <span class="stars"></span>

            </div>

            <div class="price-row">

                <h2 class="price"></h2>

                <button class="cart-btn">

                    <i class="ri-shopping-bag-line"></i>

                    Add to Cart

                </button>

            </div>

        </div>

    </div>

</template>

<!-- Wishlist JS -->

<script src="wish.js"></script>

<script src="wc.js"></script>

</body>
</html>
