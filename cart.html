<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Website -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>HandiHub - Handmade Products</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="style.css">

    <!--icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <!-- Logo -->

        <div class="logo">

            <img src="images/logo.png" alt="HandiHub Logo">

            <h2>HandiHub</h2>

        </div>

        <!-- Search Bar -->

        <div class="search-box">

            <input type="text" placeholder="Search handmade products...">

        </div>

        <!-- Navigation Menu -->

        <nav>

            <ul>

                <ul>

    <li><a href="index.html" class="active">Home</a></li>

    <li><a href="collections.html">Collections</a></li>

    <li><a href="new-arrival.html">New Arrivals</a></li>

    <li><a href="contact.html">Contact</a></li>

</ul>

            </ul>

        </nav>

        <!-- Right Side Icons -->

        <div class="header-icons">

            <button class="seller-btn"
onclick="window.location.href='seller.html'">
    Become a Seller
</button>
<!-- Wishlist -->
<a href="wish.html" class="wishlist-nav">
    <i class="bi bi-heart"></i>
    <span id="wishlistCount">0</span>
</a>

<!-- Notifications -->
<a href="not.html"><i class="bi bi-bell"></i></a>

<!-- Cart -->
<a href="cart.html" class="cart-nav">
    <i class="bi bi-cart3"></i>
    <span id="cartCount">0</span>
</a>

<!-- Profile -->
<a href="man.html"><i class="bi bi-person"></i></a>

        </div>

    </header>

<!-- ================= CART PAGE START ================= -->

<main class="cart-page">

    <h1 class="cart-title">Your Cart</h1>

    <!-- Empty Cart -->
    <section id="empty-cart" class="empty-cart">

        <div class="empty-card">

          <div class="empty-icon">
    <i class="bi bi-bag"></i>
</div>

            <h2>Your cart is empty</h2>

            <p>Discover handmade treasures waiting for you.</p>

            <a href="collections.html" class="shop-btn">
                Shop Now
            </a>

        </div>
<!-- PRODUCTS -->
<div id="cartContainer" class="cart-grid"></div>
    </section>

    <!-- Filled Cart -->
    <section id="cart-section" class="cart-section">

        <div id="cart-items" class="cart-items">

            <!-- JS will generate cart items -->

        </div>

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
            </div>

            <hr>

            <div class="summary-row total">
                <span>Total</span>
                <span id="total">₹0</span>
            </div>

            <button class="checkout-btn" onclick="window.location.href='./checkout.html'">
    Proceed to Checkout
</button>

        </div>

    </section>

</main>

<!-- ================= CART PAGE END ================= -->


<!-- JS -->
<script src="cart.js"></script>

<script src="wc.js"></script>

</body>
</html>
